# ============================================================
# OrangeHRM QA Framework - Application Configuration
# ============================================================

# --- Application URLs ---
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# --- Default Credentials ---
admin.username=Admin
admin.password=admin123

# --- Browser Configuration ---
# Supported values: chrome, firefox
browser=chrome

# --- Headless Execution ---
# Set to true for CI/CD pipeline execution
headless=true

# --- Timeouts (in seconds) ---
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# --- Screenshot Configuration ---
screenshot.on.failure=true
screenshot.dir=test-output/screenshots

# --- Allure Results Directory ---
allure.results.dir=target/allure-results

# --- Environment Tag (for Allure report) ---
environment=staging
